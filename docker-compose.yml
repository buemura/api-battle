name: apibattle

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apibattle
      POSTGRES_USER: apibattle
      POSTGRES_PASSWORD: apibattle
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apibattle -d apibattle"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Pick the implementation with API_IMPL (e.g. API_IMPL=api-rust-axum).
    build: ./${API_IMPL:-api-node-express}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: apibattle
      DB_USER: apibattle
      DB_PASSWORD: apibattle
      DB_POOL_SIZE: 10
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
