server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:apibattle}
    username: ${DB_USER:apibattle}
    password: ${DB_PASSWORD:apibattle}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    property-naming-strategy: SNAKE_CASE

logging:
  level:
    root: WARN
    com.apibattle: INFO
