quarkus.http.port=${PORT:8080}
quarkus.banner.enabled=false
quarkus.shutdown.timeout=10s

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:apibattle}
quarkus.datasource.username=${DB_USER:apibattle}
quarkus.datasource.password=${DB_PASSWORD:apibattle}
quarkus.datasource.jdbc.min-size=${DB_POOL_SIZE:10}
quarkus.datasource.jdbc.initial-size=${DB_POOL_SIZE:10}
quarkus.datasource.jdbc.max-size=${DB_POOL_SIZE:10}
quarkus.datasource.devservices.enabled=false

# The schema is owned by db/init.sql.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.jackson.property-naming-strategy=SNAKE_CASE

quarkus.log.level=WARN
quarkus.log.category."com.apibattle".level=INFO
