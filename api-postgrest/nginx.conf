# Maps the public REST contract onto PostgREST's /rpc/* endpoints.
# __PORT__ is substituted by entrypoint.sh.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    access_log    off;
    server_tokens off;
    default_type  application/json;
    client_max_body_size 16k;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    upstream postgrest {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    server {
        listen __PORT__;

        # Defaults, overridden per location below. Headers with an empty value
        # are not sent upstream.
        set $pgrst_accept       "application/json";
        set $pgrst_content_type "";
        set $account_id         "";

        proxy_http_version 1.1;
        proxy_set_header Connection   "";
        proxy_set_header Accept       $pgrst_accept;
        proxy_set_header Content-Type $pgrst_content_type;
        proxy_set_header X-Account-Id $account_id;
        proxy_hide_header Content-Location;
        proxy_hide_header Content-Range;

        # Never leak PostgREST's error format for unexpected failures.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @internal_error;

        location = /health {
            if ($request_method !~ ^(GET|HEAD)$) { return 405 '{"error":"method not allowed"}'; }
            set $pgrst_accept "text/plain";
            proxy_pass http://postgrest/rpc/health;
        }

        location = /accounts {
            if ($request_method !~ ^(GET|HEAD)$) { return 405 '{"error":"method not allowed"}'; }
            proxy_pass http://postgrest/rpc/list_accounts?page=$arg_page&page_size=$arg_page_size;
        }

        location ~ ^/accounts/(\d+)$ {
            set $id $1;
            if ($request_method !~ ^(GET|HEAD)$) { return 405 '{"error":"method not allowed"}'; }
            proxy_pass http://postgrest/rpc/get_account?id=$id;
        }

        location ~ ^/accounts/(\d+)/transactions$ {
            set $account_id $1;
            if ($request_method = POST) { rewrite ^ /_add_transaction last; }
            if ($request_method !~ ^(GET|HEAD)$) { return 405 '{"error":"method not allowed"}'; }
            set $id $account_id;
            set $account_id "";
            proxy_pass http://postgrest/rpc/list_transactions?id=$id&page=$arg_page&page_size=$arg_page_size;
        }

        location = /_add_transaction {
            internal;
            # Raw body goes to the function's single text parameter.
            set $pgrst_content_type "text/plain";
            proxy_pass http://postgrest/rpc/add_transaction;
        }

        location ~ ^/transactions/(\d+)$ {
            set $id $1;
            if ($request_method !~ ^(GET|HEAD)$) { return 405 '{"error":"method not allowed"}'; }
            proxy_pass http://postgrest/rpc/get_transaction?id=$id;
        }

        location = /docs {
            default_type "text/html; charset=utf-8";
            alias /usr/share/apibattle/docs.html;
        }

        location = /openapi.yaml {
            default_type application/yaml;
            alias /usr/share/apibattle/openapi.yaml;
        }

        location / {
            return 404 '{"error":"not found"}';
        }

        location @internal_error {
            return 500 '{"error":"internal server error"}';
        }
    }
}
